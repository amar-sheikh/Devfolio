<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Confirm Your Email</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 600px;
        margin: 40px auto;
        background-color: #ffffff;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        border: 1px solid #eaeaea;
      }

      h2 {
        color: #2d3748;
        font-size: 24px;
        margin-bottom: 20px;
      }

      p {
        color: #4a5568;
        font-size: 16px;
        line-height: 1.6;
      }

      .btn {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 24px;
        background-color: #ed8936;
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 16px;
      }

      .footer {
        margin-top: 40px;
        font-size: 14px;
        color: #a0aec0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Confirm your email</h2>
      <p>Hello <strong>{{ user.username }}</strong>,</p>
      <p>Thanks for signing up to <strong>Devfolio</strong>! To get started, please confirm your email address by clicking the button below:</p>
      <p>
        <a href="{{ activate_url }}" class="btn">Confirm Email</a>
      </p>
      <p>If you did not sign up for this account, you can safely ignore this email.</p>
      <div class="footer">
        &mdash; The Devfolio Team
      </div>
    </div>
  </body>
</html>
